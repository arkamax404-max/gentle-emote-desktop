[package]
name = "gentle-emote-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
png = "0.18"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
